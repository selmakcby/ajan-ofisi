# Ajan Ofisi · sunucu sürümü
#   docker compose up -d --build
#   docker compose logs ofis        # ilk açılışta KURULUM KODU burada
# Erişim (alan adı, HTTPS, ters vekil) senin elinde: vekili 127.0.0.1:8796'ya yönlendir ve
# OFIS_ALAN_ADI'yı (ör. ofis.alanadiniz.com) .env dosyasına yaz.
services:
  ofis:
    build: .
    image: ajan-ofisi:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OFIS_DIS_PORT:-8796}:8796"   # yalnız sunucunun kendisinden/vekilden erişilir
    environment:
      OFIS_ALAN_ADI: ${OFIS_ALAN_ADI:-}             # boşsa yalnız localhost kabul edilir
      TZ: ${TZ:-Europe/Istanbul}                     # gece/gündüz ve gün sonu raporu saati
    volumes:
      - ofis-veri:/veri                              # hesap, ajanlar, hafıza, çıktılar, ayarlar, Claude oturumları
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8796/api/saglik', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ofis-veri:
