<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajan Ofisi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ff7a59%22/%3E%3Crect x=%229%22 y=%2211%22 width=%2214%22 height=%2210%22 rx=%223%22 fill=%22%23fff7f2%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --krem:#efe7da; --murekkep:#3b342c; --soluk:#8a7f72; --mercan:#ff7a59; --mercan-k:#e9603f;
  --cam:rgba(255,250,243,.72); --cam-kenar:rgba(255,255,255,.8); --sag:384px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--krem);color:var(--murekkep);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#sahne{position:fixed;inset:0;display:block}
.vinyet{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 42% 58%,transparent 58%,rgba(120,96,70,.14) 100%)}
.cam{background:var(--cam);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);border:1px solid var(--cam-kenar);box-shadow:0 10px 40px rgba(90,70,50,.12),0 1px 0 rgba(255,255,255,.6) inset;border-radius:18px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
h3.kucuk{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--soluk)}

/* üst bar */
.ustbar{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:28px;padding:0 20px;background:rgba(250,245,237,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(59,52,44,.08);z-index:5}
.marka{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--mercan);display:grid;place-items:center;box-shadow:0 4px 14px rgba(255,122,89,.4)}
.logo i{width:13px;height:9px;border-radius:3px;background:#fff7f2;position:relative}
.logo i::before,.logo i::after{content:"";position:absolute;top:3px;width:3px;height:3px;border-radius:1px;background:var(--mercan)}
.logo i::before{left:3px}.logo i::after{right:3px}
.marka b{font-family:"Space Grotesk",sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em}
.marka small{font-size:11px;color:var(--soluk);font-weight:600;letter-spacing:.06em;margin-left:2px}
.sekmeler{display:flex;gap:4px;height:100%}
.sekmeler button{position:relative;padding:0 12px;font-size:14px;font-weight:500;color:#6d6357}
.sekmeler button:hover{color:var(--murekkep)}
.sekmeler button.secili{color:var(--murekkep);font-weight:600}
.sekmeler button.secili::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--murekkep)}
.ustbar .bosluk{flex:1}
.hap{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.08)}
.hap b{font-family:"Space Grotesk",sans-serif;font-weight:600}
.nokta{width:8px;height:8px;border-radius:50%;background:#b9ad9e;flex:none}
.nokta.canli{background:var(--mercan);box-shadow:0 0 0 4px rgba(255,122,89,.18);animation:atis 1.4s ease-in-out infinite}
@keyframes atis{50%{box-shadow:0 0 0 7px rgba(255,122,89,.06)}}
.saat{font-size:13px;color:var(--soluk);font-variant-numeric:tabular-nums}
.dugme{padding:7px 12px;font-size:13px;font-weight:500;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.08);transition:background .15s,transform .15s}
.dugme:hover{background:#fff}.dugme:active{transform:scale(.97)}

/* selamlama */
.selam{position:fixed;top:78px;left:22px;width:330px;padding:18px 20px;z-index:3}
.selam .tarih{font-size:12px;color:var(--soluk);font-weight:500}
.selam h1{font-family:"Space Grotesk",sans-serif;font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 8px}
.selam p{font-size:14px;line-height:1.5;color:#4d453c}
.selam p b{color:var(--murekkep)}
.selam .ozetdugme{margin-top:12px;background:var(--murekkep);color:#fff7ee;font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px}
.selam .ozetdugme:hover{background:#2a241e}

/* sağ kolon */
.sag{position:fixed;top:76px;right:16px;bottom:42px;width:var(--sag);display:flex;flex-direction:column;gap:12px;z-index:3}
.kutu{padding:16px 16px 12px;display:flex;flex-direction:column;min-height:0}
.kutu .bas{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.kutu .bas h2{font-family:"Space Grotesk",sans-serif;font-size:16px;font-weight:600}
.kutu .bas small{display:block;font-size:12px;color:var(--soluk);margin-top:1px}
.koyu{background:var(--murekkep);color:#fff7ee;font-size:12px;font-weight:600;padding:7px 11px;border-radius:9px;white-space:nowrap}
.koyu:hover{background:#2a241e}
.ceo-kutu{flex:0 1 auto;max-height:52%}
.kartlar{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.kart{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);border-radius:12px;padding:10px 12px;animation:gir .35s ease}
.kart .ust{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--soluk);font-weight:500}
.avatar{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.avatar.foto{width:26px;height:26px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(59,52,44,.22)}
.avatar.foto.orta{width:30px;height:30px}
.avatar.foto.buyuk{width:80px;height:80px;box-shadow:0 0 0 3px #fff,0 6px 18px rgba(59,52,44,.25)}
.portre-bas{display:flex;align-items:center;gap:16px;margin:4px 0 8px}
.portre-bas h2{margin:2px 0 2px}
.meme-alt{font-size:12.5px;font-style:italic;color:var(--mercan-k);font-weight:500;letter-spacing:.01em}
.ad-avatar{display:flex;align-items:center;gap:10px}
.kart h4{font-size:13.5px;font-weight:600;margin:5px 0 3px;line-height:1.3}
.kart p{font-size:12.5px;line-height:1.45;color:#5d5348;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kart .dugmeler{display:flex;gap:6px;margin-top:8px}
.kart .onay{background:var(--murekkep);color:#fff7ee;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px}
.kart .sonra{font-size:12px;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid rgba(59,52,44,.14)}
.kart.sonra-k{opacity:.6}
.kart.onaylandi{opacity:.7}
.kart.onaylandi .dugmeler{display:none}
.bos{font-size:12.5px;color:var(--soluk);padding:6px 2px}
.akis-kutu{flex:1 1 0}
.canli-rozet{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mercan-k)}
.akis{list-style:none;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-height:0}
.akis li{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(59,52,44,.06);animation:kaygir .35s ease}
@keyframes kaygir{from{transform:translateY(-6px)}to{transform:none}}
.akis li .avatar{margin-top:1px}
.akis li div{min-width:0}
.akis li p{font-size:13px;line-height:1.38}
.akis li small{display:block;font-size:11.5px;color:#a3978a;margin-top:2px}
.akis li.ok p{color:var(--mercan-k);font-weight:600}
.akis li.hafiza p{color:#8a5a14;font-weight:600}
@keyframes gir{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* komut */
.komut{position:fixed;bottom:22px;left:calc((100% - var(--sag) - 16px) / 2);transform:translateX(-50%);width:min(600px,calc(100% - 460px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:20px;z-index:3}
.komut .ceo-ikon{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mercan-k);background:rgba(255,122,89,.12);padding:6px 8px;border-radius:8px}
.komut input{flex:1;border:none;outline:none;background:transparent;font:inherit;font-size:15px;color:var(--murekkep);padding:10px 4px;min-width:0}
.komut input::placeholder{color:#a3978a}
.gonder{background:var(--mercan);color:#fff;font-weight:600;font-size:14px;padding:11px 18px;border-radius:14px;box-shadow:0 4px 14px rgba(255,122,89,.35);transition:transform .15s,background .15s}
.gonder:hover{background:var(--mercan-k)}.gonder:active{transform:scale(.96)}
.gonder:disabled{opacity:.55;cursor:wait}

/* ajan paneli (sağ kolonun üstüne biner) */
.panel{position:fixed;top:76px;right:16px;bottom:42px;width:var(--sag);overflow:auto;padding:22px;transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:4;background:rgba(255,250,243,.94)}
.panel.acik{transform:none}
.panel .kapat{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:10px;font-size:18px;color:var(--soluk)}
.panel .kapat:hover{background:rgba(255,255,255,.8)}
.panel .oda-etiket{font-size:12px;color:var(--soluk);font-weight:500}
.panel h2{font-family:"Space Grotesk",sans-serif;font-size:24px;font-weight:600;letter-spacing:-.02em;margin:2px 0 10px}
.panel h3{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--soluk);margin:14px 0 8px}
.tg-rozet{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#eee6dc}
.tg-bagli{background:#d9efdf;color:#2f6b3f}.tg-gecersiz{background:#fbe0d8;color:#a1402a}.tg-eslesme_bekliyor{background:#fff0c9;color:#7a5b10}
.tg-not{font-size:13px;color:var(--soluk);margin:8px 0;line-height:1.45}.tg-hata{font-size:12px;color:#a1402a;margin:6px 0}
.tg-form{display:flex;gap:8px;margin:6px 0}.tg-form input{flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:1px solid rgba(59,52,44,.15);background:#fff;font:inherit;font-size:13px}
.tg-kod{font-family:"Space Grotesk",sans-serif;font-size:34px;font-weight:600;letter-spacing:.2em;margin:6px 0;user-select:all}
.tg-alt{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.tg-kaldir{color:#a1402a}
.durum{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(59,52,44,.07);color:#6d6357;max-width:100%}
.durum.calisiyor{background:rgba(255,122,89,.14);color:var(--mercan-k)}
.durum .nokta{width:7px;height:7px;background:currentColor;box-shadow:none;animation:none}
.canli-liste{display:flex;flex-direction:column;gap:8px}
.canli-liste .oturum{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.08)}
.canli-liste .ust{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.canli-liste .ust .nokta,.canli-liste .alt .nokta{width:7px;height:7px;border-radius:50%;background:#c9bfb2;flex:none}
.canli-liste .calisiyor>.nokta{background:#5aa36a}
.canli-liste small{display:block;font-size:12px;color:var(--soluk);margin-top:2px;line-height:1.35}
.canli-liste .alt{display:flex;gap:8px;align-items:baseline;margin:8px 0 0 14px;font-size:12.5px}
.canli-liste .bos{font-size:12.5px;color:var(--soluk)}
.satirlar{margin:16px 0 4px;display:flex;flex-direction:column;gap:10px}
.satir{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:13px;line-height:1.4}
.satir span:first-child{color:var(--soluk)}
.not{font-size:12px;line-height:1.45;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);border-radius:12px;padding:10px 12px;color:#5d5348;margin-top:10px;white-space:pre-line}
.hazir{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hazir button{text-align:left;font-size:12.5px;font-weight:500;line-height:1.3;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);transition:background .15s,transform .15s,border-color .15s}
.hazir button:hover{background:#fff;border-color:rgba(255,122,89,.45)}
.hazir button:active{transform:scale(.97)}
.yaz{display:flex;gap:8px}
.yaz input{flex:1;min-width:0;border:1px solid rgba(59,52,44,.12);background:rgba(255,255,255,.75);border-radius:12px;padding:11px 12px;font:inherit;font-size:13px;outline:none;color:var(--murekkep)}
.yaz input:focus{border-color:rgba(255,122,89,.6)}
.yaz .gonder{padding:10px 14px;font-size:13px}
.ajan-liste{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ajan-liste button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);font-size:13.5px;font-weight:500;text-align:left}
.ajan-liste button:hover{background:#fff}
.ajan-liste small{color:var(--soluk);font-weight:400;font-size:12px;text-align:right}

.mini-sayilar{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin:4px 0 12px}
.mini-sayilar div{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.95);border-radius:12px;padding:9px 11px}
.mini-sayilar b{display:block;font-family:"Space Grotesk",sans-serif;font-size:20px;font-weight:700}
.mini-sayilar span{font-size:11.5px;color:var(--soluk)}
.cipler{display:flex;flex-wrap:wrap;gap:6px}
.cip{font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(59,52,44,.1);color:#5d5348}
.yetenekler{display:flex;flex-direction:column;gap:6px}
.yetenek{text-align:left;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);transition:background .15s,border-color .15s}
.yetenek:hover{background:#fff;border-color:rgba(255,122,89,.45)}
.yetenek div{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:500}
.yetenek small{color:var(--soluk);font-weight:400;font-size:11.5px;white-space:nowrap}
.yetenek.aktif{border-color:rgba(255,122,89,.6);background:#fff}
.ycubuk{height:4px;border-radius:2px;background:rgba(59,52,44,.1);margin-top:8px;overflow:hidden;position:relative}
.ycubuk i{position:absolute;top:0;bottom:0;width:30%;background:var(--mercan);border-radius:2px;animation:kay 1.3s ease-in-out infinite}
@keyframes kay{from{left:-30%}to{left:100%}}
.etiket3d.alt{background:rgba(255,251,246,.72);border-style:dashed}
.etiket3d.alt .ad{font-size:11px;color:#8a7f72}

/* sekme sayfaları */
.sayfa{position:fixed;top:76px;left:22px;right:calc(var(--sag) + 32px);bottom:42px;padding:24px 26px;overflow:auto;z-index:4;display:none;background:rgba(255,250,243,.93)}
.sayfa.acik{display:block;animation:gir .3s ease}
.sayfa h2{font-family:"Space Grotesk",sans-serif;font-size:26px;font-weight:700;letter-spacing:-.02em}
.sayfa .alt{font-size:13px;color:var(--soluk);margin:4px 0 18px;line-height:1.45}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.izgara .kart p{-webkit-line-clamp:4}
.izgara .kart ul{list-style:none;margin-top:6px;display:flex;flex-direction:column;gap:5px}
.izgara .kart li{font-size:12.5px;line-height:1.4;color:#5d5348;padding-left:10px;position:relative}
.izgara .kart li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:var(--mercan)}
.izgara .kart button.git{margin-top:8px;font-size:12px;font-weight:600;color:var(--mercan-k)}
/* Ajanlar sayfası */
.arac-cubugu{display:flex;gap:8px;margin:0 0 16px}
.izgara .kart .oda-adi{font-size:11.5px;color:var(--soluk);margin-top:2px}
.izgara .kart .islemler{display:flex;gap:12px;margin-top:10px}
.izgara .kart .islemler button{font-size:12px;font-weight:600;color:var(--mercan-k)}
.izgara .kart .islemler button.sil{color:#a1402a}
.form-a{max-width:640px}
.form-a label{display:block;font-size:12.5px;font-weight:600;color:var(--soluk);margin:14px 0 5px}
.form-a input[type=text],.form-a select,.form-a textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid rgba(59,52,44,.15);background:#fff;font:inherit;font-size:14px;color:var(--murekkep)}
.form-a textarea{min-height:70px;resize:vertical}
.form-a details{margin-top:18px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.55)}
.form-a summary{cursor:pointer;font-weight:600;font-size:13.5px}
.form-a .kutucuk{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--murekkep);margin:6px 0}
.form-a .gorev{display:grid;grid-template-columns:1fr auto;gap:6px;margin:8px 0;padding:8px;border-radius:10px;background:rgba(255,255,255,.7)}
.form-a .gorev textarea{grid-column:1 / -1;min-height:56px}
.form-a .dugmeler-a{display:flex;gap:10px;margin-top:20px}
.form-a .ipucu{font-size:12px;color:var(--soluk);margin-top:4px}
.sayfa h2.ara-baslik{margin-top:28px}
/* Projeler / Sorular */
.soru-rozet{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--mercan);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.durum-rozet{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(59,52,44,.08);color:var(--soluk)}
.durum-rozet.acik{background:#ddf2e2;color:#2f7a4a}.durum-rozet.onay_bekliyor{background:#fde4cc;color:#a1561f}.durum-rozet.kapali{background:#ece7e0}
.durum-rozet.maliyet,.durum-rozet.yayin-mail-para,.durum-rozet.buyuk-degisiklik{background:#fbdde3;color:#a1402a}
.ilerleme{height:7px;border-radius:4px;background:rgba(59,52,44,.08);overflow:hidden;margin:8px 0 4px}
.ilerleme i{display:block;height:100%;background:var(--mercan);border-radius:4px}
.proje-kart .gorevler,.proje-kart .notlar{font-size:12.5px;color:#5d5348;margin-top:6px}
.proje-kart .notlar{color:var(--soluk);font-style:italic}
.proje-kart textarea,.soru-kart textarea{width:100%;margin-top:8px;padding:7px 9px;border-radius:9px;border:1px solid rgba(59,52,44,.15);font:inherit;font-size:13px;min-height:52px;resize:vertical;background:#fff}
.soru-kart .sure{font-size:11.5px;color:var(--soluk);margin-top:4px}
.soru-kart p{-webkit-line-clamp:unset!important;display:block!important}
.saat-satir{display:flex;gap:10px;align-items:center;margin:0 0 16px;font-size:13px}
.saat-satir input{padding:6px 8px;border-radius:9px;border:1px solid rgba(59,52,44,.15);font:inherit}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soluk);font-weight:600;padding:8px 10px;border-bottom:1px solid rgba(59,52,44,.12)}
td{padding:9px 10px;border-bottom:1px solid rgba(59,52,44,.06);font-variant-numeric:tabular-nums}
td.sayi,th.sayi{text-align:right}
.ozet-sayilar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ozet-sayilar div{background:rgba(255,255,255,.72);border-radius:12px;padding:12px 16px;min-width:150px}
.ozet-sayilar b{display:block;font-family:"Space Grotesk",sans-serif;font-size:26px;font-weight:700}
.ozet-sayilar span{font-size:12px;color:var(--soluk)}

async function getJSON(yol) {
  const r = await fetch(yol, { cache:'no-store' });
  if (r.status === 401 && kapiGecti) location.reload(); // oturum süresi doldu → giriş ekranı
  if (!r.ok) throw new Error(yol + ' ' + r.status);

async function postJSON(yol, govde) {

  if (r.status === 401 && kapiGecti && yol !== '/api/oturum') location.reload(); // oturum düştü → giriş

/* ---------- iş zarfı ---------- */
const zarflar = [];
const zarfGeo = yuvarlak(.5, .1, .34, .03);
function zarfGonder(hedef, bitince = () => {}) {
  const ceo = ajanBul('ceo');
  if (!ceo || hedef.id === 'ceo') { bitince(); return; }
  const bas = new THREE.Vector3(ceo.grup.position.x, 2.4, ceo.grup.position.z + .4);
  const son = new THREE.Vector3(hedef.grup.position.x, 2.3, hedef.grup.position.z + .2);
  const orta = bas.clone().lerp(son, .5); orta.y = 7 + bas.distanceTo(son) * .12;
  const egri = new THREE.QuadraticBezierCurve3(bas, orta, son);
  const iz = new THREE.Line(new THREE.BufferGeometry().setFromPoints(egri.getPoints(80)), new THREE.LineBasicMaterial({ color:'#ff7a59', transparent:true, opacity:.85 }));
  iz.geometry.setDrawRange(0, 0); scene.add(iz);
  const z = new THREE.Mesh(zarfGeo, new THREE.MeshStandardMaterial({ color:'#fff3ea', emissive:'#ff7a59', emissiveIntensity:.55 }));
  z.castShadow = true; scene.add(z);
  z.add(new THREE.PointLight('#ff8a66', 6, 6, 2));
  zarflar.push({ egri, iz, z, t:0, sure:1.5, bitince, son:false, solma:0 });
}
function zarfGuncelle(dt) {
  for (let i = zarflar.length - 1; i >= 0; i--) {
    const e = zarflar[i];
    if (!e.son) {
      e.t = Math.min(1, e.t + dt / e.sure);
      const k = e.t < .5 ? 2 * e.t * e.t : 1 - Math.pow(-2 * e.t + 2, 2) / 2;
      e.z.position.copy(e.egri.getPoint(k)); e.z.rotation.y += dt * 3;
      e.iz.geometry.setDrawRange(0, Math.floor(k * 81));
      if (e.t >= 1) { e.son = true; e.bitince(); scene.remove(e.z); }
    } else {
      e.solma += dt;

      if (e.solma > .7) { scene.remove(e.iz); e.iz.geometry.dispose(); e.iz.material.dispose(); e.z.material.dispose(); zarflar.splice(i, 1); }
    }

}

/* alt-ajan doğuşu: Task/Agent aracında masanın önünde yarı saydam kopya */
const altAjanlar = [];
const ALT_OLCEK = .6;
function altAjanEkle(a, detay) {
  const kendi = altAjanlar.filter(x => x.ana === a.id);
  if (kendi.length >= 4) return;
  const g = new THREE.Group();
  const i = kendi.length;
  g.position.copy(a.grup.position).add(new THREE.Vector3(-1.1 + i * 1.1, 0, 2.05));
  g.scale.setScalar(ALT_OLCEK);
  // yavru kedi: ananın deseni, yarı saydam
  const kedi = createCat({ desen:a.kedi?.desen || 'tekir', yavru:true });
  kedi.setDurum('calisiyor'); g.add(kedi.group);
  // yavruya basınca ananın paneli açılır (alt-ajanlar orada listelenir)
  const hit = new THREE.Mesh(new THREE.BoxGeometry(1.9, 2.4, 2.4), new THREE.MeshBasicMaterial());
  hit.visible = false; hit.position.set(0, 1.2, .4); hit.userData.ajan = a.id; g.add(hit); secilebilir.push(hit);
  scene.add(g);
  const { deger } = detayAyir(detay);
  const alt = { id:'alt-' + a.id + '-' + Date.now() + '-' + i, ana:a.id, alt:true, ad:'alt-ajan', grup:g, hit, durum:'calisiyor', eylem:kisa(deger || 'görev', 30), faz:Math.random() * 6, dogus:performance.now(), kedi };
  altAjanlar.push(alt);
  return alt;
}
function altAjanTemizle(anaId, yalnizTerminal = false) {
  for (let i = altAjanlar.length - 1; i >= 0; i--) {
    const x = altAjanlar[i]; if (x.ana !== anaId || (yalnizTerminal && !x.terminal)) continue;
    scene.remove(x.grup); altAjanlar.splice(i, 1);
    const h = secilebilir.indexOf(x.hit); if (h >= 0) secilebilir.splice(h, 1);
    const e = etiketler.get(x.id); if (e) { e.d.remove(); etiketler.delete(x.id); }
  }
}
function altAjanAnimasyon(t, dt) {
  altAjanlar.forEach(x => {
    const k = Math.min(1, (performance.now() - x.dogus) / 500);
    x.grup.scale.setScalar(ALT_OLCEK * k);
    x.grup.position.y = .1 + Math.abs(Math.sin(t * 3 + x.faz)) * .03;
    x.kedi?.update(dt);
  });
}

function terminalEylem(t) {

}
function terminalSenkron() {
  AJANLAR.forEach(a => {
    if (a.id === 'ceo') return;
    const hepsi = [...terminaller.values()].filter(t => t.ajan === a.id);
    const calisan = hepsi.filter(t => t.durum === 'calisiyor');

    if (calisan.length && !ofisKosusu) {

      a.eylem = 'terminal · ' + terminalEylem(calisan[0]);
      a.is = 'terminal · ' + (calisan[0].pencere_adi && calisan[0].pencere_adi !== 'claude.exe' ? calisan[0].pencere_adi : calisan[0].oturum_adi);

      ajanUyut(a);
    }
    // ana figür ilk oturum; diğer çalışan oturumlar yarı saydam alt figür (en fazla 4)
    const istenen = a.terminal ? calisan.slice(1, 5) : [];
    const mevcut = altAjanlar.filter(x => x.ana === a.id && x.terminal);
    if (mevcut.length !== istenen.length) {
      altAjanTemizle(a.id, true);

    altAjanlar.filter(x => x.ana === a.id && x.terminal).forEach((x, i) => { if (istenen[i]) x.eylem = kisa(terminalEylem(istenen[i]), 30); });

  const nabiz = cekirdek.dusun ? (Math.sin(t * 6) * .5 + .5) * .6 : 0;
  const p = cekirdek.parla + nabiz;
  cekirdek.kristal.rotation.y += dt * (.25 + p * 1.5);
  cekirdek.kristal.position.y = Math.sin(t * 1.2) * .06;
  cekirdek.kristalMat.emissiveIntensity = .35 + p * 1.4;
  cekirdek.isilti.scale.setScalar(3.2 + p * 2.6);
  cekirdek.isilti.material.opacity = .75 + Math.min(.25, p);
  cekirdek.isik.intensity = 2 + p * 9;
  cekirdek.g.scale.setScalar(1 + p * .12);
}
function dongu() {
  const dt = Math.min(saat.getDelta(), .05), t = saat.elapsedTime;

  }

  controls.update();
  renderer.render(scene, camera);
  etiketGuncelle();
  odaAdGuncelle();
  requestAnimationFrame(dongu);
}
